name: akumuslim
description: "A new Flutter project."

publish_to: 'none' 

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  http: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_logo.png
    - assets/quran.db
  
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#0C331E"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  min_sdk_android: 24